<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Canada flag">
  <title>Canada flag</title>
  <defs>
    <clipPath id="flag-circle"><circle cx="40" cy="40" r="39"/></clipPath>
  </defs>
  <g clip-path="url(#flag-circle)">
    <image href="/assets/destinations/canada-flag.webp" x="0" y="0" width="80" height="80" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="40" cy="40" r="39" fill="none" stroke="#e7edf2" stroke-width="2"/>
</svg>
